name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 构建漂移检查 + 兼容性测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Rebuild bundle and fail on drift
        # assets/js/spv2-core.js 是发行产物且已入库；源码改了却忘记
        # 重新构建会让线上跑旧核心，这里直接让 CI 变红。
        run: |
          npm run build
          git diff --exit-code assets/js/spv2-core.js
      - name: Compat tests (original vectors + golden set + built bundle)
        run: npm run test:golden
